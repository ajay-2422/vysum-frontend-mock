<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vysum | Attempt History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">V</div>
      <div>
        <h2>VYSUM</h2>
        <p>Eyedrop Use Results</p>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="history-link" href="index.html">Back to results</a>
      <div class="prototype-label">RESULTS</div>
    </div>
  </header>

  <main class="history-main">
    <div class="history-intro">
      <p class="small-title">PAST ATTEMPTS</p>
      <h1>History</h1>
      <p>Open an attempt to see the information recorded for it. These are sample records; new attempts are not saved by this demo.</p>
    </div>
    <p id="historyCount" class="history-count"></p>
    <div id="historyList" class="history-list"></div>
  </main>

  <footer>Vysum sample page — information about eye drop use.</footer>

  <script src="script.js"></script>
  <script src="history.js"></script>
</body>
</html>
